name: UI Screenshots

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture & visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Node (backend + frontend build) ───────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

      - name: Link dist to backend/public
        run: |
          rm -rf backend/public
          ln -s "$PWD/frontend/dist" backend/public

      # ── Python (selenium + pillow for diff) ───────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install selenium pillow

      # ── Chrome ────────────────────────────────────────────────────────
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Seed fixture database
        run: node scripts/seed_fixture_db.js /tmp/fixture.db

      # ── Screenshots ──────────────────────────────────────────────────
      - name: Take screenshots (desktop 1440px)
        run: python scripts/ci_ui_shots.py --db /tmp/fixture.db --out /tmp/ui-shots --width 1440

      - name: Take screenshots (mobile 480px)
        run: python scripts/ci_ui_shots.py --db /tmp/fixture.db --out /tmp/ui-shots-mobile --width 480 --height 900

      # ── Visual regression ─────────────────────────────────────────────
      # No `if:` guard. Conditioning this on baselines existing is what made it
      # green while it had never run: with an empty baseline directory the step
      # was skipped and the job reported success. visual_diff.py now fails on a
      # missing baseline itself, which is the honest place for that decision.
      - name: Visual regression check (desktop)
        run: python scripts/visual_diff.py screenshots/baseline /tmp/ui-shots --threshold 0.01
        continue-on-error: false

      - name: Visual regression check (mobile)
        run: python scripts/visual_diff.py screenshots/baseline-mobile /tmp/ui-shots-mobile --threshold 0.01
        continue-on-error: false

      # ── Upload ────────────────────────────────────────────────────────
      - name: Upload desktop screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots-desktop
          path: /tmp/ui-shots/*.png
          retention-days: 30

      - name: Upload mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots-mobile
          path: /tmp/ui-shots-mobile/*.png
          retention-days: 30
